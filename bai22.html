<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết quả Bài tập 22</title>
<style>
:root{--bg:#2a0d0d;--paper:#f6e7c8;--gold:#e8b44a;--ink:#3b1410}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 16px;background:radial-gradient(circle at 50% 0,#5a1a14,var(--bg) 70%);color:var(--paper);font-family:Georgia,"Times New Roman",serif}
main{width:min(960px,100%);margin:0 auto}
a.back{color:var(--gold);text-decoration:none}
a.back:hover,a.back:focus-visible{text-decoration:underline}
h1{font-size:clamp(26px,5vw,40px);margin:16px 0 8px;color:var(--gold)}
p{line-height:1.6;margin:0 0 8px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.stats div{background:var(--paper);color:var(--ink);padding:12px 18px;border-left:6px solid var(--gold);border-radius:4px}
.stats b{display:block;font-size:22px}
figure{margin:24px 0 0;background:var(--paper);padding:10px;border-radius:4px}
img{width:100%;height:auto;display:block}
figcaption{color:var(--ink);font-size:14px;padding-top:8px}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Về trang chủ</a>
  <h1>Kết quả Bài tập 22</h1>
  <p>Họ tên: Trương Tấn Phát – MSSV: 231A010271</p>
  <p>Kết quả làm bài trắc nghiệm trên Wayground (Quizizz).</p>
  <div class="stats">
    <div><b>95%</b>Câu đúng</div>
    <div><b>95 / 100</b>Số câu đúng</div>
    <div><b>5</b>Số câu sai</div>
    <div><b>15 giây</b>Thời gian mỗi câu hỏi</div>
  </div>
  <figure>
    <img src="images/ket-qua-bai22.png" alt="Ảnh chụp màn hình kết quả Bài tập 22: 95% câu đúng, 95 câu đúng, 5 câu sai">
    <figcaption>Ảnh chụp màn hình trang tóm tắt đánh giá.</figcaption>
  </figure>
</main>
</body>
</html>
